<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">从 Agent Loop 到 Dataflow</title>
  <desc id="desc">LangChain、LangGraph 与 MoFA 分别关注 Agent 应用、显式运行编排和 Agent 组件组合。</desc>
  <defs>
    <style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;fill:#172d43}.eyebrow{font-size:19px;letter-spacing:3px;fill:#208778;font-weight:700}.heading{font-size:55px;font-weight:700}.sub{font-size:27px;fill:#526778}.label{font-size:30px;font-weight:700}.note{font-size:21px;fill:#526778}</style>
  </defs>
  <rect width="1200" height="630" fill="#f8f6ef"/><circle cx="1150" cy="40" r="180" fill="#e8f1e9"/>
  <text x="72" y="68" class="eyebrow">AGENT · 架构学习</text><text x="72" y="152" class="heading">从 Agent Loop</text>
  <text x="72" y="222" class="heading">到 Dataflow</text><text x="75" y="278" class="sub">理解 MoFA、LangChain 与 LangGraph 的分工</text>
  <rect x="72" y="365" width="320" height="128" rx="20" fill="#dfefe7" stroke="#aad4c5"/><rect x="440" y="365" width="320" height="128" rx="20" fill="#fffdf7" stroke="#cbd5d7"/><rect x="808" y="365" width="320" height="128" rx="20" fill="#fffdf7" stroke="#cbd5d7"/>
  <text x="232" y="420" class="label" text-anchor="middle">LangChain</text><text x="232" y="460" class="note" text-anchor="middle">组装 Agent 应用</text>
  <text x="600" y="420" class="label" text-anchor="middle">LangGraph</text><text x="600" y="460" class="note" text-anchor="middle">控制状态与执行</text>
  <text x="968" y="420" class="label" text-anchor="middle">MoFA</text><text x="968" y="460" class="note" text-anchor="middle">组合 Agent 组件</text>
  <path d="M400 429 H428 M768 429 H796" fill="none" stroke="#208778" stroke-width="3"/>
  <text x="600" y="555" class="note" text-anchor="middle">应用构建 · 运行编排 · 数据流组合</text>
</svg>
