  <defs>
    <style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;fill:#172d43}.eyebrow{font-size:19px;letter-spacing:3px;fill:#208778;font-weight:700}.heading{font-size:52px;font-weight:700}.sub{font-size:26px;fill:#526778}.label{font-size:28px;font-weight:700}.note{font-size:20px;fill:#526778}</style>
  </defs>
  <rect width="1200" height="630" fill="#f8f6ef"/><circle cx="1140" cy="50" r="180" fill="#e8f1e9"/>
  <text x="72" y="68" class="eyebrow">AGENT · 工程实践</text>
  <text x="72" y="152" class="heading">别再盲目搞滑窗了：</text>
  <text x="72" y="222" class="heading">自研 Agent 上下文裁剪</text>
