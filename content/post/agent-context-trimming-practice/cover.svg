  <rect x="72" y="365" width="320" height="128" rx="20" fill="#dfefe7" stroke="#aad4c5"/><rect x="440" y="365" width="320" height="128" rx="20" fill="#fffdf7" stroke="#cbd5d7"/><rect x="808" y="365" width="320" height="128" rx="20" fill="#dfefe7" stroke="#aad4c5"/>
  <text x="232" y="420" class="label" text-anchor="middle">真身投影分离</text><text x="232" y="460" class="note" text-anchor="middle">存储与请求载荷解耦</text>
  <text x="600" y="420" class="label" text-anchor="middle">工具骨架降维</text><text x="600" y="460" class="note" text-anchor="middle">历史SQL结果砍掉90%</text>
