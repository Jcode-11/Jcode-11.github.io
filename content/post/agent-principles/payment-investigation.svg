<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1190" viewBox="0 0 1200 1190" role="img" aria-labelledby="title desc">
  <title id="title">教学案例：用证据驱动支付异常排查</title>
  <desc id="desc">用户报告支付成功而业务未更新。先查询订单、支付通知和业务日志，再依据证据决定路径。如果已经处理，返回证据并验证业务状态；如果通知处理失败，在获得授权和完成幂等校验后受控重放，再验证业务状态；如果信息不足，继续查询或者询问用户。不得直接修改订单或重复扣款。此图是示例路径，实际动作应由当前证据决定。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#208778" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;fill:#172d43}.title{font-size:42px;font-weight:700}.label{font-size:29px;font-weight:700}.note{font-size:24px;fill:#526778}.small{font-size:22px;fill:#526778}.line{fill:none;stroke:#208778;stroke-width:3;marker-end:url(#arrow);stroke-linejoin:round}.join{fill:none;stroke:#208778;stroke-width:3;stroke-linejoin:round}</style>
  </defs>
  <rect width="1200" height="1190" fill="#f8f6ef"/>
  <text x="50" y="68" class="title">支付异常排查：每一步都要有依据</text>
  <text x="53" y="111" class="small">教学示例 · 展示可能的路径，实际选择取决于当前证据</text>
  <rect x="230" y="150" width="740" height="93" rx="18" fill="#edf0f1" stroke="#cbd5d7"/>
  <text x="600" y="207" class="label" text-anchor="middle">支付已成功，业务却没有更新</text>
  <path d="M600 255 V294" class="line"/>
  <rect x="230" y="306" width="740" height="116" rx="18" fill="#fffdf7" stroke="#cbd5d7"/>
  <text x="600" y="353" class="label" text-anchor="middle">查询订单 / 支付通知 / 业务日志</text>
  <text x="600" y="392" class="note" text-anchor="middle">读取真实数据，区分支付状态与业务处理状态</text>
  <path d="M600 434 V471" class="line"/>
  <rect x="410" y="483" width="380" height="91" rx="18" fill="#dfefe7" stroke="#aad4c5"/>
  <text x="600" y="540" class="label" text-anchor="middle">依据证据，选择下一步</text>
  <path d="M600 574 V608 H205 V644" class="line"/>
  <path d="M600 608 V644" class="line"/>
  <path d="M600 608 H995 V644" class="line"/>
  <rect x="45" y="656" width="320" height="157" rx="18" fill="#fffdf7" stroke="#cbd5d7"/>
  <rect x="440" y="656" width="320" height="157" rx="18" fill="#dfefe7" stroke="#aad4c5"/>
  <rect x="835" y="656" width="320" height="157" rx="18" fill="#fffdf7" stroke="#cbd5d7"/>
  <text x="205" y="704" class="label" text-anchor="middle">实际已处理</text>
  <text x="205" y="750" class="note" text-anchor="middle">返回订单与处理证据</text>
  <text x="205" y="787" class="small" text-anchor="middle">确认问题是否仍然存在</text>
  <text x="600" y="704" class="label" text-anchor="middle">通知处理失败</text>
  <text x="600" y="750" class="note" text-anchor="middle">授权 + 幂等校验</text>
  <text x="600" y="787" class="small" text-anchor="middle">满足条件后受控重放</text>
  <text x="995" y="704" class="label" text-anchor="middle">信息不足</text>
  <text x="995" y="750" class="note" text-anchor="middle">继续查询 / 询问用户</text>
  <text x="995" y="787" class="small" text-anchor="middle">补充证据后再继续</text>
  <path d="M205 825 V879 H600" class="join"/>
  <path d="M600 825 V929" class="line"/>
  <path d="M995 825 V871 H1179 V363 H982" class="line"/>
  <rect x="230" y="941" width="740" height="105" rx="18" fill="#edf0f1" stroke="#cbd5d7"/>
  <text x="600" y="986" class="label" text-anchor="middle">验证业务状态，再给出结论</text>
  <text x="600" y="1024" class="note" text-anchor="middle">附上验证结果；未解决则继续排查或移交</text>
  <rect x="45" y="1081" width="1110" height="70" rx="14" fill="#e9eeea"/>
  <text x="600" y="1125" class="note" text-anchor="middle">执行边界：重放需授权和幂等保护；不直接改订单，不重复扣款。</text>
</svg>
